name: CI for Windows
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_windows.md

# Run on push.
on: 
  - push
  - pull_request

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Identify Qt build environment
        id: qt-env
        shell: pwsh
        run: |
          $os = [System.Environment]::OSVersion.Version.ToString()
          "os=$os" >> $env:GITHUB_OUTPUT
          $vswhere = if (Get-Command vswhere -ErrorAction SilentlyContinue) { "vswhere" } else { "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" }
          $vs = & $vswhere -latest -property installationVersion
          if (-not $vs) { $vs = "default" }
          "vs=$vs" >> $env:GITHUB_OUTPUT

      - name: Restore Qt build cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.qt-env.outputs.os }}-${{ steps.qt-env.outputs.vs }}-x64-release-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Save Qt build cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build

      - name: Prepare MoGRU Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package_win -Force | Out-Null
          Copy-Item src\bazel-bin\win32\installer\*.msi package_win\ -Force
          Copy-Item scripts\install_windows.ps1 package_win\install.ps1 -Force

      - name: upload MoGRU-windows-x64.zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU-windows-x64
          path: package_win/
          if-no-files-found: warn

      - name: upload MoGRU64_x64.msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU64_x64.msi
          path: src/bazel-bin/win32/installer/*.msi
          if-no-files-found: warn

  build_on_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: Identify Qt build environment
        id: qt-env
        shell: pwsh
        run: |
          $os = [System.Environment]::OSVersion.Version.ToString()
          "os=$os" >> $env:GITHUB_OUTPUT
          $vswhere = if (Get-Command vswhere -ErrorAction SilentlyContinue) { "vswhere" } else { "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" }
          $vs = & $vswhere -latest -property installationVersion
          if (-not $vs) { $vs = "default" }
          "vs=$vs" >> $env:GITHUB_OUTPUT

      - name: Restore Qt build cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.qt-env.outputs.os }}-${{ steps.qt-env.outputs.vs }}-arm64-release-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools/build_qt.py --release --confirm_license

      # This is needed only for GitHub Actions where free disk space is quite limited.
      - name: Delete Qt src to save disk space
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\src
        run: |
          rmdir third_party\qt_src /s /q

      - name: Save Qt build cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: build artifacts
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk build package --config release_build

      - name: Prepare MoGRU Windows ARM64 Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package_win_arm64 -Force | Out-Null
          Copy-Item src\bazel-bin\win32\installer\*.msi package_win_arm64\ -Force
          Copy-Item scripts\install_windows.ps1 package_win_arm64\install.ps1 -Force

      - name: upload MoGRU-windows-arm64.zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU-windows-arm64
          path: package_win_arm64/
          if-no-files-found: warn

      - name: upload MoGRU64_arm64.msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU64_arm64.msi
          path: src/bazel-bin/win32/installer/*.msi
          if-no-files-found: warn

  test_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test ... -c dbg --build_tests_only --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure()
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools\collect_test_logs.py --bep bep.jsonl --out "%GITHUB_WORKSPACE%\test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-${{ runner.os }}-${{ runner.arch }}
          path: test_logs
          if-no-files-found: ignore

  test_on_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py

      - name: runtests
        shell: cmd
        working-directory: .\src
        env:
          ANDROID_NDK_HOME: ""
        run: |
          bazelisk test ... -c dbg --build_tests_only --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure()
        shell: cmd
        working-directory: .\src
        run: |
          python build_tools\collect_test_logs.py --bep bep.jsonl --out "%GITHUB_WORKSPACE%\test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-${{ runner.os }}-${{ runner.arch }}
          path: test_logs
          if-no-files-found: ignore

  # actions/cache works without this job, but having this would increase the likelihood of cache hit
  # in other jobs. Another approach would be to use "needs:".
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
  cache_deps_on_x64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py --cache_only

  # actions/cache works without this job, but having this would increase the likelihood of cache hit
  # in other jobs. Another approach would be to use "needs:".
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
  cache_deps_on_arm64:
    # https://github.com/actions/runner-images/blob/main/images/windows/Windows11-Arm64-Readme.md
    runs-on: windows-11-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install Dependencies
        shell: cmd
        working-directory: .\src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python build_tools/update_deps.py --cache_only
