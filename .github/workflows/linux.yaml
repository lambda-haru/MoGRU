name: CI for Linux
# https://github.com/google/mozc/blob/master/docs/build_mozc_for_linux.md

# Run on push and pull request.
on:
  - push
  - pull_request

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: Restore Bazel repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('src/MODULE.bazel', 'src/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build --repository_cache=${HOME}/.cache/bazel-repo package --config release_build
          bazelisk build --repository_cache=${HOME}/.cache/bazel-repo -c opt //unix/fcitx5:fcitx5-mogru.so //unix/fcitx5:fcitx5-mozc-gru.so //gui/tool:mozc_tool --//unix/fcitx5:use_server=False

      - name: Prepare MoGRU Linux Package
        run: |
          mkdir -p package_linux/icons/hicolor/128x128/apps
          mkdir -p package_linux/icons/hicolor/48x48/apps
          mkdir -p package_linux/icons/hicolor/32x32/apps
          mkdir -p package_linux/icons/mogru
          mkdir -p package_linux/models

          # 既存 package (旧 mozc.zip) の全成果物を展開
          unzip -q src/bazel-bin/unix/mozc.zip -d package_linux/

          # fcitx5-mogru.so を追加（ルート直下および usr/lib/fcitx5 配下）
          cp -f src/bazel-bin/unix/fcitx5/fcitx5-mogru.so package_linux/
          mkdir -p package_linux/usr/lib/fcitx5
          cp -f src/bazel-bin/unix/fcitx5/fcitx5-mogru.so package_linux/usr/lib/fcitx5/

          # GUI ツールをルート直下にコピー (mogru_tool および mozc_tool)
          cp -f src/bazel-bin/gui/tool/mozc_tool package_linux/mozc_tool
          cp -f src/bazel-bin/gui/tool/mozc_tool package_linux/mogru_tool

          # モデルファイル
          cp -f models/*.bin package_linux/models/ 2>/dev/null || true
          cp -f models/*.ini package_linux/models/ 2>/dev/null || true

          # アイコンアセット（128x128）
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/hicolor/128x128/apps/fcitx_mogru.png
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/hicolor/128x128/apps/mogru.png
          cp -f src/data/images/product_icon_32bpp-128.png package_linux/icons/mogru/product_icon_32bpp-128.png

          # アイコンアセット（32x32）
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/fcitx_mogru.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/mogru.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/hicolor/32x32/apps/org.fcitx.Fcitx5.Addon.MoGRU.png
          cp -f src/data/images/unix/ime_product_icon_opensource-32.png package_linux/icons/mogru/ime_product_icon_opensource-32.png

          # アイコンアセット（48x48）
          for mode in direct hiragana katakana_full katakana_half alpha_full alpha_half; do
            if [ -f "src/data/images/unix/48x48/${mode}.png" ]; then
              cp -f "src/data/images/unix/48x48/${mode}.png" "package_linux/icons/hicolor/48x48/apps/fcitx_mogru_${mode}.png"
            fi
          done

          # ツールメニュー用アイコン（48x48）
          cp -f src/data/images/unix/ui-tool.png package_linux/icons/hicolor/48x48/apps/fcitx_mogru_tool.png
          cp -f src/data/images/unix/ui-properties.png package_linux/icons/hicolor/48x48/apps/fcitx_mogru_properties.png
          cp -f src/data/images/unix/ui-dictionary.png package_linux/icons/hicolor/48x48/apps/fcitx_mogru_dictionary.png
          cp -f src/data/images/unix/ui-*.png package_linux/icons/mogru/ 2>/dev/null || true

          # スタンドアロンインストーラスクリプトの同梱
          cp -f scripts/install_linux.sh package_linux/install.sh
          chmod 755 package_linux/install.sh

      - name: Upload MoGRU Linux Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU-linux
          path: package_linux/
          if-no-files-found: warn

      - name: Upload fcitx5-mogru Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fcitx5-mogru.so
          path: src/bazel-bin/unix/fcitx5/fcitx5-mogru.so
          if-no-files-found: warn

  test:
    # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev qt6-base-dev fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev
          #
          # Unset the Android NDK setting to skip the unnecessary configuration.
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV

      - name: Restore Bazel repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('src/MODULE.bazel', 'src/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      - name: bazel test
        working-directory: ./src
        run: |
          bazelisk test --repository_cache=${HOME}/.cache/bazel-repo ... -c dbg --build_tests_only --test_output=errors --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure()
        working-directory: ./src
        run: |
          python3 build_tools/collect_test_logs.py --bep bep.jsonl --out "${GITHUB_WORKSPACE}/test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-${{ runner.os }}
          path: test_logs
          if-no-files-found: ignore
