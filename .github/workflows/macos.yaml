name: CI for macOS
# https://github.com/google/mozc/blob/master/docs/build_mozc_in_osx.md

# Run on push.
on: 
  - push
  - pull_request

permissions:
  contents: read

# Prevent previous workflows from running.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_arm64:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python3 build_tools/update_deps.py

      - name: Identify Qt build environment
        id: qt-env
        run: |
          echo "macos=$(sw_vers -productVersion)" >> "$GITHUB_OUTPUT"
          xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "xcode=$xcode" >> "$GITHUB_OUTPUT"

      - name: Restore Qt build cache
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: qt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.qt-env.outputs.macos }}-${{ steps.qt-env.outputs.xcode }}-arm64-release-${{ hashFiles('src/build_tools/build_qt.py', 'src/build_tools/update_deps.py') }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        working-directory: ./src
        run: |
          python3 build_tools/build_qt.py --release --confirm_license --macos_cpus=arm64

      - name: Save Qt build cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party/qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: bazel build
        working-directory: ./src
        run: |
          bazelisk build package --macos_cpus=arm64 --config release_build

      - name: Prepare MoGRU macOS Package
        run: |
          mkdir -p package_mac
          cp -f src/bazel-bin/mac/*.pkg package_mac/
          cp -f scripts/install_macos.sh package_mac/install.sh
          chmod 755 package_mac/install.sh

      - name: upload MoGRU-macOS-arm64.zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU-macOS-arm64
          path: package_mac/
          if-no-files-found: warn

      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MoGRU_arm64.pkg
          path: src/bazel-bin/mac/*.pkg
          if-no-files-found: warn

  test:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python3 build_tools/update_deps.py

      - name: bazel test
        working-directory: ./src
        run: |
          bazelisk test ... -c dbg --build_tests_only --build_event_json_file=bep.jsonl

      - name: Collect failing test logs
        if: failure()
        working-directory: ./src
        run: |
          python3 build_tools/collect_test_logs.py --bep bep.jsonl --out "${GITHUB_WORKSPACE}/test_logs"

      - name: Upload failing test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-logs-${{ runner.os }}
          path: test_logs
          if-no-files-found: ignore

  # actions/cache works without this job, but having this would increase the likelihood of cache hit
  # in other jobs. Another approach would be to use "needs:".
  # https://docs.github.com/en/actions/using-jobs/using-jobs-in-a-workflow
  cache_deps:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ hashFiles('src/build_tools/update_deps.py') }}

      - name: Install dependencies
        working-directory: ./src
        # This command uses src/third_party_cache as the download cache.
        run: |
          python3 build_tools/update_deps.py --cache_only
